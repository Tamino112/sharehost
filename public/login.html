<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <title>title.login</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/auth.js"></script>
</head>
<body data-page="login">
  <header id="nav"></header>
  <main class="shell center-page">
    <form class="auth-card glass glass--xl" data-glow id="form" novalidate>
      <div class="auth-card__head">
        <div class="icon-tile icon-tile--accent" data-icon="login"></div>
        <h1 class="h1" data-i18n="auth.welcomeBack"></h1>
        <p class="muted" style="margin:0" data-i18n="auth.loginText"></p>
      </div>
      <div class="stack" data-errors>
        <div class="field">
          <label for="username" data-i18n="auth.username"></label>
          <input class="input" id="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password" data-i18n="auth.password"></label>
          <input class="input" id="password" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="submit" data-i18n="nav.signIn"></button>
      <p class="small muted" style="margin:0;text-align:center" id="alt" hidden>
        <span data-i18n="auth.noAccount"></span> <a href="/register" style="color:var(--accent-text);font-weight:550" data-i18n="auth.createAccount"></a>
      </p>
    </form>
  </main>
</body>
</html>
