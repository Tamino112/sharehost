<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <meta name="description" content="Self-hosted, open-source file sharing.">
  <title></title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/upload.js"></script>
</head>
<body>
  <header id="nav"></header>
  <main class="shell">
    <section class="hero">
      <div class="hero__copy">
        <span class="eyebrow" data-i18n="home.eyebrow" data-reveal></span>
        <h1 class="display" id="tagline"></h1>
        <p class="lead" id="description" data-reveal style="--d:3"></p>
        <div class="hero__stats" data-reveal style="--d:4">
          <div><strong id="stat-size">—</strong><span data-i18n="home.statSize"></span></div>
          <div><strong id="stat-expiry">—</strong><span data-i18n="home.statExpiry"></span></div>
          <div><strong>0</strong><span data-i18n="home.statTrackers"></span></div>
        </div>
      </div>

      <div class="uploader glass glass--xl" data-glow data-reveal style="--d:2">
        <!-- picking files -->
        <div class="uploader__inner" data-view="pick">
          <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-describedby="drop-hint">
            <div class="dropzone__icon" id="drop-icon"></div>
            <div class="stack" style="--gap:6px">
              <div class="h2" data-i18n="upload.drop"></div>
              <div class="muted small" id="drop-hint"></div>
              <div class="row pick-btns">
                <div class="menu pick-menu" id="pick-menu">
                  <button type="button" class="btn btn--sm" id="add-btn" aria-haspopup="menu" aria-expanded="false"></button>
                </div>
              </div>
            </div>
            <input type="file" id="file-input" multiple hidden>
          </div>
          <div id="folder-pickers" hidden></div>
          <div class="file-list" id="file-list"></div>

          <div id="options-wrap" hidden>
            <button class="disclosure" id="options-toggle" aria-expanded="false" aria-controls="options">
              <span data-i18n="upload.options"></span><span id="options-summary" class="subtle"></span><span id="chev"></span>
            </button>
            <div class="collapse" id="options">
              <div>
                <div class="options">
                  <div class="field">
                    <label for="opt-expiry" data-i18n="upload.expiry"></label>
                    <select class="select" id="opt-expiry"></select>
                  </div>
                  <div class="field">
                    <label for="opt-max" data-i18n="upload.maxDownloads"></label>
                    <input class="input" id="opt-max" type="number" min="1" inputmode="numeric" data-i18n-placeholder="upload.unlimited">
                  </div>
                  <div class="field span-2" id="opt-password-field">
                    <label for="opt-password" data-i18n="upload.password"></label>
                    <div class="input-group">
                      <input class="input" id="opt-password" type="password" autocomplete="new-password" data-i18n-placeholder="upload.passwordPh">
                      <button class="btn btn--ghost btn--icon btn--sm" type="button" id="pw-toggle" data-i18n-title="common.showPassword"></button>
                    </div>
                  </div>
                  <div class="field span-2">
                    <label for="opt-title" data-i18n="upload.title"></label>
                    <input class="input" id="opt-title" maxlength="120" data-i18n-placeholder="upload.titlePh">
                  </div>
                  <div class="field span-2">
                    <label for="opt-message" data-i18n="upload.message"></label>
                    <textarea class="textarea" id="opt-message" maxlength="1000" rows="2" data-i18n-placeholder="upload.messagePh"></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="toggle-row" id="zip-row" hidden>
            <div class="stack" style="--gap:2px">
              <strong class="h3" id="zip-label" data-i18n="upload.zipTitle"></strong>
              <span class="hint" data-i18n="upload.zipHint"></span>
            </div>
            <label class="switch"><input type="checkbox" id="opt-zip" checked aria-labelledby="zip-label"><span></span></label>
          </div>

          <p class="hint" id="upload-notice" hidden style="padding:0 8px;margin:0"></p>
          <button class="btn btn--primary btn--lg btn--block" id="upload-btn" disabled></button>
        </div>

        <!-- uploading -->
        <div class="progress-view" data-view="progress" hidden>
          <div class="ring" id="ring">
            <svg viewBox="0 0 170 170"><circle class="ring__track" cx="85" cy="85" r="76"/><circle class="ring__bar" cx="85" cy="85" r="76"/></svg>
            <div class="ring__label"><span><span id="pct">0</span><small>%</small></span></div>
          </div>
          <div class="stack" style="--gap:6px">
            <div class="h2" data-i18n="upload.uploading"></div>
            <div class="muted small mono" id="progress-meta">&nbsp;</div>
          </div>
          <button class="btn btn--ghost btn--sm" id="cancel-btn" data-i18n="common.cancel"></button>
        </div>

        <!-- done -->
        <div class="progress-view" data-view="done" hidden>
          <div style="position:relative">
            <div class="success-badge" id="success-badge"></div>
            <div class="burst" id="burst"></div>
          </div>
          <div class="stack" style="--gap:6px">
            <div class="h1" data-i18n="upload.done"></div>
            <div class="muted" id="done-meta"></div>
          </div>
          <div class="link-box">
            <input id="share-link" readonly aria-label="Share link">
            <button class="btn btn--primary btn--sm" id="copy-btn"></button>
          </div>
          <div class="row" style="justify-content:center">
            <a class="btn btn--sm" id="open-btn" target="_blank" rel="noopener"></a>
            <button class="btn btn--sm" id="again-btn"></button>
            <button class="btn btn--sm btn--ghost btn--danger" id="undo-btn" hidden></button>
          </div>
        </div>

        <!-- uploads not allowed -->
        <div class="progress-view" data-view="locked" hidden>
          <div class="lock-icon" id="locked-icon"></div>
          <div class="stack" style="--gap:8px">
            <div class="h2" data-i18n="upload.lockedTitle"></div>
            <p class="muted" style="margin:0;max-width:34ch" data-i18n="upload.lockedText"></p>
          </div>
          <div class="row" style="justify-content:center">
            <a class="btn btn--primary" href="/login" data-i18n="nav.signIn"></a>
            <a class="btn" href="/register" id="locked-register" data-i18n="auth.createAccount" hidden></a>
          </div>
        </div>
      </div>
    </section>

    <section class="features" id="features">
      <article class="feature glass" data-glow data-reveal>
        <div class="icon-tile icon-tile--accent" data-icon="server"></div>
        <h3 class="h2" data-i18n="feature.selfTitle"></h3>
        <p data-i18n="feature.selfText"></p>
      </article>
      <article class="feature glass" data-glow data-reveal style="--d:1">
        <div class="icon-tile icon-tile--accent" data-icon="lock"></div>
        <h3 class="h2" data-i18n="feature.privateTitle"></h3>
        <p data-i18n="feature.privateText"></p>
      </article>
      <article class="feature glass" data-glow data-reveal style="--d:2">
        <div class="icon-tile icon-tile--accent" data-icon="hourglass"></div>
        <h3 class="h2" data-i18n="feature.expiryTitle"></h3>
        <p data-i18n="feature.expiryText"></p>
      </article>
    </section>

    <div class="marquee" id="marquee" aria-hidden="true"><div class="marquee__track"></div></div>
  </main>
</body>
</html>
